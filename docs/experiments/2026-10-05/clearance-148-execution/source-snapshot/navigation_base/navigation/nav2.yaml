/**:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 8.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    odom_topic: /model/vehicle/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    path_handler_plugins: [PathHandler]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.10
      stateful: true
    PathHandler:
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 4.0
      enforce_path_inversion: false
      enforce_path_rotation: false
      reject_unit_path: false
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      max_linear_vel: 0.22
      min_linear_vel: 0.0
      max_angular_vel: 0.30
      min_angular_vel: -0.30
      lookahead_dist: 0.65
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.25
      rotate_to_heading_min_angle: 0.50
      use_rotate_to_heading: true
      allow_reversing: false
      max_linear_accel: 0.4
      max_linear_decel: -0.4
      max_angular_accel: 0.5
      max_angular_decel: -0.5
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.12
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.8
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.0
      transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: vehicle/odom
      robot_base_frame: vehicle/base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[-1.73,-0.53],[-0.32,-0.96],[0.32,-0.96],[0.32,0.96],[-0.32,0.96],[-1.73,0.53]]"
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 11.5
          obstacle_min_range: 0.1
          raytrace_max_range: 12.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 3.3
        cost_scaling_factor: 1.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: vehicle/base_link
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: true
      footprint: "[[-1.73,-0.53],[-0.32,-0.96],[0.32,-0.96],[0.32,0.96],[-0.32,0.96],[-1.73,0.53]]"
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 11.5
          obstacle_min_range: 0.1
          raytrace_max_range: 12.0
          raytrace_min_range: 0.1
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 3.3
        cost_scaling_factor: 1.0
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: vehicle/odom
    global_frame: map
    robot_base_frame: vehicle/base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.25
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.5

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: vehicle/base_link
    odom_topic: /model/vehicle/odometry
    bt_loop_duration: 20
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_name_prefixes: [compute_path, follow_path, spin, backup, wait]
